services:
  postgres:
    image: postgres:16-alpine
    container_name: coop-itsm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-coop_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coop_pass}
      POSTGRES_DB: ${POSTGRES_DB:-coop_itsm_db}
    volumes:
      - coop_itsm_postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-coop_user} -d ${POSTGRES_DB:-coop_itsm_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: coop-itsm-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-coop_user}:${POSTGRES_PASSWORD:-coop_pass}@postgres:5432/${POSTGRES_DB:-coop_itsm_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-coop-itsm-jwt-secret-change-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      PORT: 5000
      NODE_ENV: production
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
    ports:
      - "5000:5000"
    command: >
      sh -c "npx prisma migrate deploy && tsx prisma/seed.ts && node dist/server.js"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: coop-itsm-client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"

volumes:
  coop_itsm_postgres_data:
