<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Report ATM Issue - Step 2</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                        "surface-container": "#eceef1",
                        "on-surface": "#191c1e",

                        "on-secondary-fixed": "#00201d",
                        "inverse-on-surface": "#f3f0f1",
                        "on-secondary-fixed-variant": "#00504a",
                        "outline": "#74777d",
                        "on-tertiary-fixed-variant": "#40465c",

                        "surface-container-highest": "#e4e2e3",
                        "primary-fixed-dim": "#bdc7d6",

                        "surface-tint": "#565f6c",

                    "borderRadius": {

                    "spacing": {

<body class="h-full bg-surface text-on-surface antialiased overflow-hidden flex font-body-md">
<!-- SideNavBar (Suppressed for focused task/flow as per guidelines: "Linear/Transactional: Login, Sign-up, Onboarding, Checkout, or 'Success/Confirmation' splash screens" - a multi-step report form falls under this to prioritize the canvas) -->
<main class="flex-1 h-full overflow-y-auto w-full">
<!-- TopAppBar (Simplified/Suppressed for focused flow) -->
<header class="bg-surface-container-lowest border-b border-outline-variant h-16 px-gutter flex items-center justify-between sticky top-0 z-40">
<div class="flex items-center gap-stack-sm">
<button class="w-10 h-10 rounded-full flex items-center justify-center hover:bg-surface-container-high transition-colors text-on-surface-variant">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-header-lg text-header-lg text-on-surface">Report Issue</h1>
</div>
<div class="font-brand-display text-brand-display text-primary">
                BankCare
            </div>
</header>
<div class="max-w-[720px] mx-auto px-gutter py-stack-lg">
<!-- Progress Indicator -->
<div class="mb-stack-lg flex items-center justify-between px-stack-lg">
<div class="flex flex-col items-center flex-1">
<div class="w-8 h-8 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center font-label-sm text-label-sm mb-stack-xs">
<span class="material-symbols-outlined text-[16px]">check</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant">Issue Type</span>
</div>
<div class="flex-1 h-[1px] bg-secondary-container mx-stack-xs -mt-6"></div>
<div class="flex flex-col items-center flex-1">
<div class="w-8 h-8 rounded-full bg-primary text-on-primary flex items-center justify-center font-label-sm text-label-sm mb-stack-xs">
                        2
                    </div>
<span class="font-label-sm text-label-sm text-primary font-bold">Details</span>
</div>
<div class="flex-1 h-[1px] bg-outline-variant mx-stack-xs -mt-6"></div>
<div class="flex flex-col items-center flex-1">
<div class="w-8 h-8 rounded-full bg-surface-container-high text-on-surface-variant flex items-center justify-center font-label-sm text-label-sm mb-stack-xs">
                        3
                    </div>
<span class="font-label-sm text-label-sm text-on-surface-variant">Review</span>
</div>
</div>
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-stack-lg shadow-sm">
<h2 class="font-header-xl text-header-xl text-on-surface mb-stack-md">Where did this happen?</h2>
<p class="font-body-md text-body-md text-on-surface-variant mb-stack-lg">Please provide the location and details of the ATM issue to help us resolve it quickly.</p>
<form class="space-y-stack-lg">
<!-- Branch Selection -->
<div class="flex flex-col gap-stack-xs">
<label class="font-label-sm text-label-sm text-on-surface" for="branch-select">Branch</label>
<div class="relative">
<select class="w-full appearance-none bg-surface-container-lowest border border-outline text-on-surface rounded-lg py-3 px-4 font-body-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary" id="branch-select">
<option selected="" value="hawassa-main">Hawassa Main Branch</option>
<option value="addis-ababa">Addis Ababa Central</option>
<option value="dire-dawa">Dire Dawa Branch</option>
<option value="other">Other / I don't know</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-on-surface-variant">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</div>
<!-- Description Area -->
<div class="flex flex-col gap-stack-xs">
<label class="font-label-sm text-label-sm text-on-surface flex justify-between" for="description">
<span>Description</span>
<span class="text-on-surface-variant font-normal">Required</span>
</label>
<textarea class="w-full bg-surface-container-lowest border border-outline text-on-surface rounded-lg py-3 px-4 font-body-md placeholder-on-surface-variant/50 focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary resize-y" id="description" placeholder="Please describe what happened..." rows="5"></textarea>
</div>
<!-- Attachment Area -->
<div class="flex flex-col gap-stack-xs">
<label class="font-label-sm text-label-sm text-on-surface flex justify-between">
<span>Attachment (optional)</span>
<span class="text-on-surface-variant font-normal">Max 5MB</span>
</label>
<div class="border-2 border-dashed border-outline-variant rounded-lg p-stack-lg flex flex-col items-center justify-center text-center hover:bg-surface-container transition-colors cursor-pointer group">
<span class="material-symbols-outlined text-4xl text-on-surface-variant mb-stack-sm group-hover:text-primary transition-colors">cloud_upload</span>
<p class="font-body-md text-body-md text-on-surface mb-stack-xs font-medium">Click to upload or drag and drop</p>
<p class="font-label-sm text-label-sm text-on-surface-variant">SVG, PNG, JPG or PDF</p>
<input accept=".svg,.png,.jpg,.jpeg,.pdf" class="hidden" type="file"/>
</div>
</div>
</form>
</div>
<!-- Navigation Actions -->
<div class="mt-stack-lg flex items-center justify-between pt-stack-md border-t border-outline-variant">
<button class="px-6 py-3 rounded-lg border border-outline text-on-surface font-label-sm text-label-sm hover:bg-surface-container-high transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2" type="button">
                    Back
                </button>
<button class="px-6 py-3 rounded-lg bg-primary text-on-primary font-label-sm text-label-sm hover:bg-primary/90 transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2" type="button">
                    Submit Request
                </button>
</div>
</div>
</main>
</body></html>
